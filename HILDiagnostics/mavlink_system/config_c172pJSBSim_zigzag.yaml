vehicle:
  mavsdk_address: "udp://:14540"
  pymavlink_address: "udpin:0.0.0.0:14550"
  # Same relay caveats as config_c172p.yaml -- point this at PX4's own WSL endpoint (the "Normal"
  # mavlink instance's bind port, 18570), not the HITL Simulink relay port. WSL IP changes across
  # reboots -- reconfirm with `wsl hostname -I` if this stops connecting (172.31.228.71 confirmed
  # current as of 2026-07-24).
  # Restore the command path used by a36, which completed all waypoints and
  # entered RTL. The WSL 14550 relay preserves the MAVSDK source endpoint,
  # unlike direct reinjection into PX4's 18570 bind socket.
  simulink_command_address: "udp://172.21.2.216:14550"
  connect_timeout_s: 900
  telemetry_timeout_s: 15
  # Upload the mission even if the stationary barometric-height preflight
  # check remains pending. The aircraft is held by JSBSim wheel brakes until
  # the mission exists; arming is handled after upload.
  health_timeout_s: 30
  continue_on_health_timeout: true
  takeoff_timeout_s: 60
  param_dump_timeout_s: 30
  # Same airframe/FCS as c172p (10044_optimAeroC172pJSBSim mirrors 10043_optimAeroC172p's
  # MIS_TAKEOFF_ALT=25 fixed-wing climb-out default).
  takeoff_altitude_m: 25.0
  takeoff_heading_deg: 105.0
  takeoff_runway_m: 700.0
  # Used to author the NAV_TAKEOFF item when no-mag EKF alignment has not yet
  # made MAVSDK's telemetry.position() stream available. These are the exact
  # coordinates in aircraft/c172p/c172pJSBSimInit.xml.
  initial_latitude_deg: 17.64450
  initial_longitude_deg: -63.21988
  initial_position_timeout_s: 5
  auto_arm: true
  # Keep telemetry/capture alive while SITL-only forced arming waits for the
  # heading estimator to align on the ground.
  arm_attempts: 90
  start_mission_attempts: 30
  auto_takeoff: true
  auto_mission: true
  # The ground model has no parking-brake actuator, so idle thrust can create a
  # brief estimator innovation while the fixed-wing is still unarmed. Relax only
  # the matching pre-arm innovation gates; in-flight EKF checks remain enabled.
  # a41 showed that restricting bank to 30 degrees causes poor waypoint
  # convergence followed by altitude loss. Restore the 45-degree setting
  # used by a36, which completed every waypoint and entered RTL.
  # Apply after arming because the persisted PX4 parameter file overrides
  # the airframe's set-default value on subsequent SITL launches.
  mission_file: "mission_c172pJSBSim_zigzag.yaml"

listener:
  enabled: true
  log_file: "mavlink_raw_log_c172pJSBSim.jsonl"
  forward_to_mavsdk: true
  relay_commands_to_simulink: true
  message_types:
    - HEARTBEAT
    - SYS_STATUS
    - BATTERY_STATUS
    - ATTITUDE
    - LOCAL_POSITION_NED
    - GLOBAL_POSITION_INT
    - GPS_RAW_INT
    - VFR_HUD
    - ACTUATOR_OUTPUT_STATUS
    - SERVO_OUTPUT_RAW
    - HIL_ACTUATOR_CONTROLS
    - HIL_SENSOR
    - HIL_GPS
    - HOME_POSITION
    - ESTIMATOR_STATUS
    - COMMAND_ACK
    - MISSION_ACK
    - MISSION_CURRENT
    - MISSION_ITEM_REACHED
    - MISSION_COUNT
    - MISSION_REQUEST
    - MISSION_REQUEST_INT
    - MISSION_ITEM
    - MISSION_ITEM_INT
    - EXTENDED_SYS_STATE
    - STATUSTEXT

safety:
  # PX4 is force-armed by the SITL launcher before the brake-less JSBSim
  # ground model can roll away. Position is still monitored throughout the
  # mission; skip only MAVSDK's redundant pre-arm health wait.
  require_position_ok_for_takeoff: true
  max_takeoff_altitude_m: 30.0
  max_mission_altitude_m: 250.0
  allow_real_vehicle_commands: true
  allow_pymavlink_commands: true
