vehicle:
  mavsdk_address: "udp://:14540"
  pymavlink_address: "udpin:0.0.0.0:14550"
  # Pure SITL test copy of config.yaml: NOT the HITL Simulink relay port here (nothing is
  # listening on 127.0.0.1:14541 in a pure SITL session). Points directly at PX4's own WSL
  # endpoint (the "Normal" mavlink instance's bind port, 18570) instead -- see
  # config_c172p.yaml for the full explanation of why this is required for MAVSDK's outbound
  # commands (arm, clear_mission, etc.) to ever reach PX4 in this setup. WSL IP changes across
  # reboots -- reconfirm with `wsl hostname -I` if this stops connecting.
  simulink_command_address: "udp://172.31.228.71:18570"
  connect_timeout_s: 180
  telemetry_timeout_s: 15
  health_timeout_s: 240
  takeoff_timeout_s: 60
  param_dump_timeout_s: 30
  takeoff_altitude_m: 3.0
  auto_arm: true
  auto_takeoff: true
  auto_mission: true
  mission_file: "mission.yaml"

listener:
  enabled: true
  log_file: "mavlink_raw_log_hex_sitl_test.jsonl"
  forward_to_mavsdk: true
  relay_commands_to_simulink: true
  message_types:
    - HEARTBEAT
    - SYS_STATUS
    - BATTERY_STATUS
    - ATTITUDE
    - LOCAL_POSITION_NED
    - GLOBAL_POSITION_INT
    - GPS_RAW_INT
    - VFR_HUD
    - ACTUATOR_OUTPUT_STATUS
    - SERVO_OUTPUT_RAW
    - HIL_ACTUATOR_CONTROLS
    - HIL_SENSOR
    - HIL_GPS
    - HOME_POSITION
    - ESTIMATOR_STATUS
    - COMMAND_ACK
    - MISSION_ACK
    - MISSION_CURRENT
    - MISSION_ITEM_REACHED
    - MISSION_COUNT
    - MISSION_REQUEST
    - MISSION_REQUEST_INT
    - MISSION_ITEM
    - MISSION_ITEM_INT
    - EXTENDED_SYS_STATE
    - STATUSTEXT

safety:
  require_position_ok_for_takeoff: true
  max_takeoff_altitude_m: 10.0
  max_mission_altitude_m: 10.0
  allow_real_vehicle_commands: true
  allow_pymavlink_commands: true
