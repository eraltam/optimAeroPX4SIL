vehicle:
  mavsdk_address: "udp://:14540"
  pymavlink_address: "udpin:0.0.0.0:14550"
  # Clone of config_c172pJSBSim.yaml -- same WSL relay caveats apply (point this at PX4's own WSL
  # endpoint, the "Normal" mavlink instance's bind port 18570, not the HITL Simulink relay port;
  # WSL IP changes across reboots, reconfirm with `wsl hostname -I` if this stops connecting;
  # 172.31.228.71 confirmed current as of 2026-07-31).
  simulink_command_address: "udp://172.31.228.71:14550"
  connect_timeout_s: 900
  telemetry_timeout_s: 15
  health_timeout_s: 240
  takeoff_timeout_s: 90
  param_dump_timeout_s: 30
  # 10045_optimAeroC130JSBSim's own MIS_TAKEOFF_ALT is left at PX4's stock default (not overridden
  # in the airframe file); this value is only used as a fallback for authoring the NAV_TAKEOFF item
  # when telemetry.position() isn't yet available, scaled the same 2x-below-cruise-altitude ratio
  # config_c172pJSBSim.yaml uses (25/50) against mission_c130JSBSim.yaml's relative_altitude_m=100.
  takeoff_altitude_m: 50.0
  # These are the exact coordinates in aircraft/C130/c130JSBSimInit.xml (same home field this SIL
  # uses for every vehicle).
  initial_latitude_deg: 17.64450
  initial_longitude_deg: -63.21988
  initial_position_timeout_s: 5
  # PLAN_JSBSIM_SFUNCTION_F22_C130.md section 7: MAVSDK's coarse is_armable health flag (checked
  # by wait_until_ready() right before arm()) goes true as soon as EKF2 completes tilt/yaw
  # alignment, but this vehicle's own commander-level health_and_arming_checks (vertical velocity
  # stability, yaw estimate error) took substantially longer to clear in the first live session --
  # confirmed via .ulg analysis: alignment itself completed by t=17s, but the estimate was still
  # visibly settling toward the true state as late as t=46s (much heavier aircraft, larger/longer
  # gear-settling transient than c172pJSBSim). 10 attempts * 5.0s = up to 50s of patience,
  # comfortably past the observed worst case, vs. controller_mavsdk.py's shared default of
  # 4 attempts * 2.0s (~6s, tuned for transient RPC/packet-loss retries, not EKF convergence) --
  # c172pJSBSim and every other vehicle that doesn't set these two keys keeps that original
  # default unchanged.
  # Raised from 10*5.0s=50s (2026-08-01, c130run7): that budget was already marginal -- needed
  # ~13-14/15 attempts once f22run24 raised its own budget to 15, so applying the same fix here
  # proactively rather than waiting to rediscover it. See section 13.7.
  arm_attempts: 15
  arm_retry_delay_s: 5.0
  auto_arm: true
  auto_takeoff: true
  auto_mission: true
  mission_file: "mission_c130JSBSim.yaml"

listener:
  enabled: true
  log_file: "mavlink_raw_log_c130JSBSim.jsonl"
  # PX4 SITL has a direct Onboard link to MAVSDK on UDP 14540. Do not relay
  # the same mission protocol through 14550 or PX4 sees two transfer partners.
  forward_to_mavsdk: false
  relay_commands_to_simulink: false
  message_types:
    - HEARTBEAT
    - SYS_STATUS
    - BATTERY_STATUS
    - ATTITUDE
    - LOCAL_POSITION_NED
    - GLOBAL_POSITION_INT
    - GPS_RAW_INT
    - VFR_HUD
    - ACTUATOR_OUTPUT_STATUS
    - SERVO_OUTPUT_RAW
    - HIL_ACTUATOR_CONTROLS
    - HIL_SENSOR
    - HIL_GPS
    - HOME_POSITION
    - ESTIMATOR_STATUS
    - COMMAND_ACK
    - MISSION_ACK
    - MISSION_CURRENT
    - MISSION_ITEM_REACHED
    - MISSION_COUNT
    - MISSION_REQUEST
    - MISSION_REQUEST_INT
    - MISSION_ITEM
    - MISSION_ITEM_INT
    - EXTENDED_SYS_STATE
    - STATUSTEXT

safety:
  # Same rationale as config_c172pJSBSim.yaml -- PX4 is force-armed by the SITL launcher before
  # the brake-less JSBSim ground model can roll away.
  require_position_ok_for_takeoff: false
  max_takeoff_altitude_m: 130.0
  max_mission_altitude_m: 400.0
  allow_real_vehicle_commands: true
  allow_pymavlink_commands: true
