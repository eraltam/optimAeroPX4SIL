vehicle:
  mavsdk_address: "udp://:14540"
  pymavlink_address: "udpin:0.0.0.0:14550"
  # Clone of config_c130JSBSim.yaml -- same WSL relay caveats apply (point this at PX4's own WSL
  # endpoint, the "Normal" mavlink instance's bind port 18570, not the HITL Simulink relay port;
  # WSL IP changes across reboots, reconfirm with `wsl hostname -I` if this stops connecting;
  # 172.31.228.71 confirmed current as of 2026-07-31).
  simulink_command_address: "udp://172.31.228.71:14550"
  connect_timeout_s: 900
  telemetry_timeout_s: 15
  health_timeout_s: 240
  takeoff_timeout_s: 90
  param_dump_timeout_s: 30
  # 10046_optimAeroF22JSBSim's own MIS_TAKEOFF_ALT is left at PX4's stock default (not overridden
  # in the airframe file); this value is only used as a fallback for authoring the NAV_TAKEOFF item
  # when telemetry.position() isn't yet available, scaled the same ratio config_c130JSBSim.yaml
  # uses (50/100) against mission_f22JSBSim.yaml's relative_altitude_m=150.
  takeoff_altitude_m: 75.0
  # These are the exact coordinates in aircraft/f22/f22JSBSimInit.xml (same home field this SIL
  # uses for every vehicle).
  initial_latitude_deg: 17.64450
  initial_longitude_deg: -63.21988
  initial_position_timeout_s: 5
  # Raised from 10*5.0s=50s (2026-08-01, f22run23): that budget exhausted all 10 attempts with
  # "velocity estimate error"/"Yaw estimate error"/"height estimate not stable" still failing,
  # the same EKF2-alignment-not-yet-converged symptom c130run1 hit at 50s (section 7) before
  # c130's own budget was raised. No confirmed empirical convergence time for f22 yet (run23's
  # own PX4 log shows a stale "Armed by external command" from an earlier, much-longer-uptime
  # session, not proof 50s is normally enough) -- doubled to 15*5.0s=75s as the next data point,
  # tighten once a real convergence timestamp is observed via .ulg estimator_status_flags
  # (cs_tilt_align/cs_yaw_align), same methodology PLAN_JSBSIM_SFUNCTION_F22_C130.md section 7 used.
  arm_attempts: 15
  arm_retry_delay_s: 5.0
  auto_arm: true
  auto_takeoff: true
  auto_mission: true
  mission_file: "mission_f22JSBSim.yaml"

listener:
  enabled: true
  log_file: "mavlink_raw_log_f22JSBSim.jsonl"
  # PX4 SITL's Onboard MAVLink instance already talks directly to UDP 14540.
  # The legacy HITL bridge duplicated MISSION_COUNT/MISSION_ITEM_INT through
  # 14550 and intermittently caused "partner id mismatch" / WPM Busy.
  forward_to_mavsdk: false
  relay_commands_to_simulink: false
  message_types:
    - HEARTBEAT
    - SYS_STATUS
    - BATTERY_STATUS
    - ATTITUDE
    - LOCAL_POSITION_NED
    - GLOBAL_POSITION_INT
    - GPS_RAW_INT
    - VFR_HUD
    - ACTUATOR_OUTPUT_STATUS
    - SERVO_OUTPUT_RAW
    - HIL_ACTUATOR_CONTROLS
    - HIL_SENSOR
    - HIL_GPS
    - HOME_POSITION
    - ESTIMATOR_STATUS
    - COMMAND_ACK
    - MISSION_ACK
    - MISSION_CURRENT
    - MISSION_ITEM_REACHED
    - MISSION_COUNT
    - MISSION_REQUEST
    - MISSION_REQUEST_INT
    - MISSION_ITEM
    - MISSION_ITEM_INT
    - EXTENDED_SYS_STATE
    - STATUSTEXT

safety:
  # Same rationale as config_c130JSBSim.yaml -- PX4 is force-armed by the SITL launcher before
  # the brake-less JSBSim ground model can roll away.
  require_position_ok_for_takeoff: false
  max_takeoff_altitude_m: 200.0
  max_mission_altitude_m: 500.0
  allow_real_vehicle_commands: true
  allow_pymavlink_commands: true
