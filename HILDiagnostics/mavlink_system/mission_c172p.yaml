mission:
  enabled: true
  name: "c172p_fixedwing_racetrack_waypoints_rtl"

  # c172p (Cessna 172P) is fixed-wing, not the hexarotor mission.yaml was written for -- speed,
  # altitude, turn radius, and end-of-mission behavior are all different on purpose, see notes below.

  # FW_AIRSPD_MIN=18 / FW_AIRSPD_TRIM=28 / FW_AIRSPD_MAX=60 m/s
  # (PX4-Autopilot/ROMFS/px4fmu_common/init.d-posix/airframes/10042_optimAeroC172p). 24 m/s sits
  # comfortably between min and trim -- enough margin above stall for turns without commanding a
  # speed the airspeed controller has to fight for.
  speed_m_s: 24.0
  # GA-aircraft pattern altitude, well above the 5-10 m used for the hexarotor mission -- fixed-wing
  # needs room to climb out and turn without terrain/obstacle margin concerns.
  relative_altitude_m: 120.0
  # Turn radius at 24 m/s and FW_R_LIM=45 deg roll is ~v^2/(g*tan(45)) = 576/9.81 ~= 59 m; 80 m gives
  # margin so PX4 doesn't have to overbank to hit the waypoint cone.
  acceptance_radius_m: 80.0
  # Fixed-wing can't stop and correct position like a multirotor -- fly_through=true lets it carry
  # speed/energy through each waypoint into the next turn instead of trying to converge on the exact
  # point (which is the correct behavior for is_fly_through=false, meant for hover-capable vehicles).
  is_fly_through: true
  loiter_time_s: 0.0 # unused with is_fly_through=true, kept only for schema symmetry with other missions

  clear_existing: true
  # Bakes a MAV_CMD_NAV_TAKEOFF item as waypoint 0 and switches controller_mavsdk.py onto the
  # mission_raw plugin instead of the simplified mission plugin used by config.yaml/mission.yaml.
  # REQUIRED for fixed-wing -- confirmed live, twice, that arming straight into AUTO_MISSION with
  # no takeoff item causes a full loss of control (attitude/altitude diverged to essentially a
  # crash), reproduced identically whether driven by this script or by hand via
  # `commander mode auto:mission` + `commander arm` at the PX4 console. A standalone
  # action.takeoff() beforehand avoids the crash but leaves PX4 stuck in AUTO_LOITER, never
  # navigating -- neither is how a real fixed-wing mission is authored; a NAV_TAKEOFF item is.
  # Hexarotor's mission.yaml does not set this and must not need it (that path is tested and
  # working end-to-end as-is).
  include_takeoff_item: true
  # RTL after mission, not a scripted autoland: c172p's landing flare/approach has not been validated
  # against live PX4 SITL yet (see optimAeroPX4SIL/CLAUDE.md section 5, "Not yet validated against
  # live PX4 SITL / EKF2"). RTL brings it back to a loiter over home using PX4's own tested RTL
  # logic instead of trusting an unverified auto-land sequence on the first real flight test.
  # With include_takeoff_item, this is baked into the raw mission plan as a trailing
  # MAV_CMD_NAV_RETURN_TO_LAUNCH item rather than set via set_return_to_launch_after_mission()
  # (mission_raw has no equivalent call).
  rtl_after_mission: true
  land_after_mission: false
  takeoff_settle_s: 2.0
  # ~3.2 km total leg length (see waypoints below) at 24 m/s is ~135 s of cruise; generous margin for
  # climb-out, turns, and RTL settling.
  mission_timeout_s: 300
  land_timeout_s: 90 # unused while land_after_mission=false, kept for schema symmetry

  # Rectangular racetrack around the vehicle's ACTUAL simulated home position, not
  # vehicle/common/setUpVehicle.m's referenceLatitude_deg/referenceLongitude_deg
  # (17.64450, -63.21988). Confirmed by live HOME_POSITION telemetry that the two differ by
  # ~2.8 km in this SIL setup (cause not yet diagnosed -- some offset between the reference point
  # and where the EKF/GPS simulation actually anchors home). This never mattered for the
  # hexarotor mission because PX4's "first waypoint too far from home" feasibility check
  # (MIS_DIST_1WP, ~900 m default) is fixed-wing-specific -- c172p's original waypoints (built
  # from the assumed reference) were silently rejected by the navigator and it fell back to
  # AUTO_LOITER instead of AUTO_MISSION, holding its initial heading instead of navigating.
  # Recomputed the same 900 m-north/700 m-east box pattern from the observed home
  # (17.6369601, -63.1982809) instead. Re-confirm HOME_POSITION if this SIL's home offset ever
  # changes (e.g. after touching setUpVehicle.m's initial conditions).
  waypoints:
    - name: "wp1_climbout_north"
      latitude_deg: 17.645045
      longitude_deg: -63.198281

    - name: "wp2_crosswind_east"
      latitude_deg: 17.645045
      longitude_deg: -63.191681

    - name: "wp3_downwind_south"
      latitude_deg: 17.636960
      longitude_deg: -63.191681

    - name: "wp4_base_return"
      latitude_deg: 17.636960
      longitude_deg: -63.198281
