vehicle:
  mavsdk_address: "udp://:14540"
  pymavlink_address: "udpin:0.0.0.0:14550"
  # UDP port the Simulink HITL connector's new "UDP Receive" block listens on, mixed
  # into the outbound serial stream to the real PX4 board (see PX4HITLConnector.slx /
  # VehicleSilSimulation.slx "PX4 HITL Interface" -> Combine_MAVLink_Streams 4th input).
  simulink_command_address: "udp://127.0.0.1:14541"
  # Also drives pymavlink's connect() timeout (see main.py listener_main()). When main.py is
  # started as a separate process/tool call from the Simulink HITL session, there's real,
  # variable overhead before Simulink ever produces its first HEARTBEAT (toolbox/path checks in
  # initVehicleSIL, then model build/compile) -- 60s proved too tight in practice. Generous on
  # purpose since waiting costs nothing but time; a genuinely broken connection still times out
  # eventually.
  # Raised from 180s (2026-07-17): the reconstructed 55-waypoint mission
  # (run_mission_reconstructed_from_real.yaml) is the largest/most complex mission run on
  # this bench so far, and Simulink's build/compile-to-first-HEARTBEAT time exceeded 180s
  # twice in a row even when MATLAB was started immediately after this relay came up.
  connect_timeout_s: 600
  telemetry_timeout_s: 15
  # Was 60s. Sessions 9/11/12 all showed "vertical velocity unstable"/"High Accelerometer
  # Bias" still recurring at the 60s mark with no sign of clearing (session_8 is the only
  # session that ever cleared, at ~25s, on an already-warm board) -- see
  # HITL_PREARM_HEALTH_INVESTIGATION.md section 10.7. Raised to see whether PX4 genuinely
  # needs more real time to settle, or never clears at all regardless of window length.
  health_timeout_s: 240
  takeoff_timeout_s: 60
  param_dump_timeout_s: 30
  # NOTE: the autopilot reboot-before-session step (see HITL_PREARM_HEALTH_INVESTIGATION.md
  # section 10) is NOT run through this config/main.py -- it must happen before Simulink
  # or MAVSDK ever open the serial port. Run reboot_autopilot.py standalone first;
  # see section 10.5/section 8 step 3.
  takeoff_altitude_m: 3.0
  auto_arm: true
  auto_takeoff: true
  auto_mission: true
  mission_file: "C:\\AS\\optimAeroPX4SIL\\HILDiagnostics\\mavlink_system\\mission.yaml"
  # Switched back to the standard 19-wp mission 2026-08-13 for a quick SiPhOG-calibration
  # smoke-test (short iteration time, stopTime_s ~300-400s is enough -- see
  # PLAN_ANELLO_X3_SIPHOG_TEMPERATURE_CALIBRATION_OUTPUT_MODES.md). The 55-wp reconstructed
  # mission this replaced (run_mission_reconstructed_from_real.yaml, needs stopTime_s>=900,
  # see HILDiagnostics/README.md section 7) is still the comparison-deliverable mission for
  # the four-way wind matrix -- switch mission_file back to it (and restore the removed
  # comment above about session_vibration_repaired_19wp_01) before running that matrix again.

listener:
  enabled: true
  log_file: "mavlink_raw_log.jsonl"
  # In HITL mode the Simulink PX4 connector only relays MAVLink to pymavlink_address
  # (14550); nothing sends to mavsdk_address (14540) on its own. When true, every
  # message this listener receives is also re-sent to vehicle.mavsdk_address so MAVSDK
  # can connect and issue arm/takeoff/mission commands. Set to false if something else
  # (e.g. a dedicated Simulink UDP relay block) already feeds MAVSDK's port directly.
  forward_to_mavsdk: true
  # MAVSDK's replies (arm/takeoff/mission commands) come back addressed to our own
  # forward socket, not to PX4 -- nothing reads them there without this. When true,
  # every message received back from MAVSDK on that socket is relayed on to
  # vehicle.simulink_command_address so it reaches the real PX4 over serial.
  relay_commands_to_simulink: true
  message_types:
    - HEARTBEAT
    - SYS_STATUS
    - BATTERY_STATUS
    - ATTITUDE
    - LOCAL_POSITION_NED
    - GLOBAL_POSITION_INT
    - GPS_RAW_INT
    - VFR_HUD
    - ACTUATOR_OUTPUT_STATUS
    - SERVO_OUTPUT_RAW
    - HIL_ACTUATOR_CONTROLS
    - HIL_SENSOR
    - HIL_GPS
    - HOME_POSITION
    - ESTIMATOR_STATUS
    - COMMAND_ACK
    - MISSION_ACK
    - MISSION_CURRENT
    - MISSION_ITEM_REACHED
    - MISSION_COUNT
    - MISSION_REQUEST
    - MISSION_REQUEST_INT
    - MISSION_ITEM
    - MISSION_ITEM_INT
    - EXTENDED_SYS_STATE
    - STATUSTEXT

safety:
  require_position_ok_for_takeoff: true
  max_takeoff_altitude_m: 10.0
  # Was 10.0m. mission.yaml's per-waypoint relative_altitude_m values (reconstructed from
  # nav_hil_ground_truth.ulg's real GPS track) peak at 2279.76m -- raised to 2400m for margin.
  # No motors are physically attached to this bench, so this is not a physical safety change,
  # only a mission-content validation limit. Revert to 10.0 for any other (non-ground-truth-replay)
  # hexarotor mission.
  max_mission_altitude_m: 2400.0
  allow_real_vehicle_commands: true
  allow_pymavlink_commands: true
  # Automatic GPS-innovation abort (added 2026-07-31, see
  # HIL_GPS_FUSION_AND_ACTUATOR_OUTPUT_FIX_2026-07-31.md section 5a): the wp35->wp36 EKF2
  # GPS-aiding rejection in session_vibration_full_mission_06 (vel_ratio=4.19,
  # pos_horiz_ratio=7.93) was a real, correct rejection of a genuinely bad sensor/trajectory
  # disagreement caused by the (since-fixed) vibration-model gain bug -- NOT a reason to loosen
  # the EKF's own gates. This is a mission-abort safety net for the next time vibration is
  # re-enabled: if ESTIMATOR_STATUS.vel_ratio or .pos_horiz_ratio continuously exceeds
  # gps_innovation_ratio_threshold for gps_innovation_sustained_s, PymavlinkListener latches
  # gps_innovation_abort and MavsdkInstructor._monitor_gps_innovation_abort immediately holds
  # then lands (not RTL -- see that method's docstring for why). Only takes effect during
  # mission execution (_wait_mission_complete), not during climb/landing.
  gps_innovation_abort_enabled: true
  gps_innovation_ratio_threshold: 1.0
  gps_innovation_sustained_s: 1.0
