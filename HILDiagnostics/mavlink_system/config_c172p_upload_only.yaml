vehicle:
  mavsdk_address: "udp://:14540"
  pymavlink_address: "udpin:0.0.0.0:14550"
  simulink_command_address: "udp://172.31.224.1:18570"
  connect_timeout_s: 180
  telemetry_timeout_s: 15
  health_timeout_s: 240
  takeoff_timeout_s: 60
  param_dump_timeout_s: 30
  takeoff_altitude_m: 25.0
  # Upload-only variant of config_c172p.yaml: disarmed on purpose, used to get
  # mission_c172p.yaml loaded onto the vehicle via MAVSDK (upload is reliable) and then hand
  # control over to direct PX4 console commands (commander mode / commander arm) instead of
  # letting MAVSDK drive arm/takeoff/mission-start -- isolating whether the console-driven path
  # (confirmed working for hexarotor) also works for c172p.
  auto_arm: false
  auto_takeoff: false
  auto_mission: true
  mission_file: "mission_c172p.yaml"

listener:
  enabled: true
  log_file: "mavlink_raw_log_c172p_upload.jsonl"
  forward_to_mavsdk: true
  relay_commands_to_simulink: true
  message_types:
    - HEARTBEAT
    - SYS_STATUS
    - BATTERY_STATUS
    - ATTITUDE
    - LOCAL_POSITION_NED
    - GLOBAL_POSITION_INT
    - GPS_RAW_INT
    - VFR_HUD
    - ACTUATOR_OUTPUT_STATUS
    - SERVO_OUTPUT_RAW
    - HIL_ACTUATOR_CONTROLS
    - HIL_SENSOR
    - HIL_GPS
    - HOME_POSITION
    - ESTIMATOR_STATUS
    - COMMAND_ACK
    - MISSION_ACK
    - MISSION_CURRENT
    - MISSION_ITEM_REACHED
    - MISSION_COUNT
    - MISSION_REQUEST
    - MISSION_REQUEST_INT
    - MISSION_ITEM
    - MISSION_ITEM_INT
    - EXTENDED_SYS_STATE
    - STATUSTEXT

safety:
  require_position_ok_for_takeoff: true
  max_takeoff_altitude_m: 30.0
  max_mission_altitude_m: 150.0
  allow_real_vehicle_commands: true
  allow_pymavlink_commands: true
