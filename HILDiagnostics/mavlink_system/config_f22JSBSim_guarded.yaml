vehicle:
  mavsdk_address: "udp://:14540"
  pymavlink_address: "udpin:0.0.0.0:14550"
  # Clone of config_f22JSBSim.yaml for the guarded first-flight test (PLAN_JSBSIM_SFUNCTION_
  # F22_C130.md section 17) -- same WSL relay caveats apply. WSL IP reconfirmed via
  # `wsl hostname -I` immediately before creating this file (2026-08-01): 172.31.228.71.
  simulink_command_address: "udp://172.31.228.71:14550"
  connect_timeout_s: 900
  telemetry_timeout_s: 15
  health_timeout_s: 240
  takeoff_timeout_s: 90
  param_dump_timeout_s: 30
  takeoff_altitude_m: 50.0
  initial_latitude_deg: 17.64450
  initial_longitude_deg: -63.21988
  initial_position_timeout_s: 5
  arm_attempts: 15
  arm_retry_delay_s: 5.0
  auto_arm: true
  auto_takeoff: true
  auto_mission: true
  mission_file: "mission_f22JSBSim_guarded.yaml"

listener:
  enabled: true
  log_file: "mavlink_raw_log_f22JSBSim_guarded.jsonl"
  forward_to_mavsdk: true
  relay_commands_to_simulink: true
  message_types:
    - HEARTBEAT
    - SYS_STATUS
    - BATTERY_STATUS
    - ATTITUDE
    - LOCAL_POSITION_NED
    - GLOBAL_POSITION_INT
    - GPS_RAW_INT
    - VFR_HUD
    - ACTUATOR_OUTPUT_STATUS
    - SERVO_OUTPUT_RAW
    - HIL_ACTUATOR_CONTROLS
    - HIL_SENSOR
    - HIL_GPS
    - HOME_POSITION
    - ESTIMATOR_STATUS
    - COMMAND_ACK
    - MISSION_ACK
    - MISSION_CURRENT
    - MISSION_ITEM_REACHED
    - MISSION_COUNT
    - MISSION_REQUEST
    - MISSION_REQUEST_INT
    - MISSION_ITEM
    - MISSION_ITEM_INT
    - EXTENDED_SYS_STATE
    - STATUSTEXT

safety:
  require_position_ok_for_takeoff: false
  max_takeoff_altitude_m: 150.0
  max_mission_altitude_m: 200.0
  allow_real_vehicle_commands: true
  allow_pymavlink_commands: true
