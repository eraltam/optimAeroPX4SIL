vehicle:
  mavsdk_address: "udp://:14540"
  pymavlink_address: "udpin:0.0.0.0:14550"
  # NOT the HITL Simulink relay port here (this is a pure SITL session, nothing is listening
  # on 127.0.0.1:14541) -- listener_pymavlink.py's command relay is transport-agnostic, it just
  # forwards whatever it captures from MAVSDK's outbound socket to this address, so pointing it
  # directly at PX4's own WSL endpoint (the "Normal" mavlink instance's bind port, 18570) closes
  # the loop for SITL instead. Without this, MAVSDK's outbound commands (arm, clear_mission,
  # etc.) go into a void and every one of them times out, even though inbound telemetry/health
  # looks fine (that direction doesn't depend on this relay at all). WSL IP changes across
  # reboots -- reconfirm with `wsl hostname -I` if this stops connecting.
  # 2026-07-23: briefly retargeted to 18580 while diagnosing a "REJ. WP CMD: partner id mismatch"
  # mission-upload failure (the relay forwards MAVSDK's captured bytes through a different socket,
  # which breaks PX4's waypoint-manager session/partner tracking for the stateful MISSION_COUNT/
  # MISSION_ITEM handshake -- confirmed independent of which instance this points at). Per
  # instruction, this relay is left unchanged/unrepaired for actual HITL use -- reverted to 18570.
  # SITL mission upload/arm/start now goes through direct_mission_uploader.py instead, which
  # bypasses this relay entirely with one persistent pymavlink socket. See
  # PLAN_INCORPORACION_AERONAVES_JSBSIM_SITL.md section 4.3.13/4.3.14.
  simulink_command_address: "udp://172.31.228.71:18570"
  connect_timeout_s: 180
  telemetry_timeout_s: 15
  health_timeout_s: 240
  takeoff_timeout_s: 60
  param_dump_timeout_s: 30
  # Matches MIS_TAKEOFF_ALT=25 set by rc.fw_defaults for c172p (fixed-wing climb-out altitude),
  # not the 3.0 m hexarotor hover-takeoff default in config.yaml.
  takeoff_altitude_m: 25.0
  auto_arm: true
  # KEEP true. Tried false once (letting the mission's own climb-out replace the standalone
  # MAVSDK takeoff action, since start_mission() after a takeoff+hold left PX4 in AUTO_LOITER,
  # not AUTO_MISSION -- confirmed live via `commander status`). That made things worse, not
  # better: without the gentle action.takeoff() first, the aircraft attempted the mission from a
  # standing start and lost control outright (telemetry showed relative_alt diverging to
  # -225,000+ m, airspeed 121 m/s, roll/pitch near +-90 deg -- a simulation blowup, not a real
  # flight). The AUTO_LOITER-after-takeoff handoff is a real unresolved issue, but the fix is NOT
  # this flag -- needs a different approach (e.g. an explicit mode-set or re-issued
  # set_current_mission_item after the takeoff hold) that hasn't been tried yet.
  auto_takeoff: true
  auto_mission: true
  mission_file: "mission_c172p.yaml"

listener:
  enabled: true
  log_file: "mavlink_raw_log_c172p.jsonl"
  forward_to_mavsdk: true
  relay_commands_to_simulink: true
  message_types:
    - HEARTBEAT
    - SYS_STATUS
    - BATTERY_STATUS
    - ATTITUDE
    - LOCAL_POSITION_NED
    - GLOBAL_POSITION_INT
    - GPS_RAW_INT
    - VFR_HUD
    - ACTUATOR_OUTPUT_STATUS
    - SERVO_OUTPUT_RAW
    - HIL_ACTUATOR_CONTROLS
    - HIL_SENSOR
    - HIL_GPS
    - HOME_POSITION
    - ESTIMATOR_STATUS
    - COMMAND_ACK
    - MISSION_ACK
    - MISSION_CURRENT
    - MISSION_ITEM_REACHED
    - MISSION_COUNT
    - MISSION_REQUEST
    - MISSION_REQUEST_INT
    - MISSION_ITEM
    - MISSION_ITEM_INT
    - EXTENDED_SYS_STATE
    - STATUSTEXT

safety:
  require_position_ok_for_takeoff: true
  # Raised for c172p's climb-out (120 m relative_altitude_m waypoints, 25 m takeoff altitude) --
  # config.yaml's 10.0 m defaults are sized for the hexarotor mission.
  max_takeoff_altitude_m: 30.0
  max_mission_altitude_m: 150.0
  allow_real_vehicle_commands: true
  allow_pymavlink_commands: true
