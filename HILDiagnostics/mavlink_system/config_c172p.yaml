vehicle:
  mavsdk_address: "udp://:14540"
  pymavlink_address: "udpin:0.0.0.0:14550"
  simulink_command_address: "udp://127.0.0.1:14541"
  connect_timeout_s: 180
  telemetry_timeout_s: 15
  health_timeout_s: 240
  takeoff_timeout_s: 60
  param_dump_timeout_s: 30
  # Matches MIS_TAKEOFF_ALT=25 set by rc.fw_defaults for c172p (fixed-wing climb-out altitude),
  # not the 3.0 m hexarotor hover-takeoff default in config.yaml.
  takeoff_altitude_m: 25.0
  auto_arm: true
  auto_takeoff: true
  auto_mission: true
  mission_file: "mission_c172p.yaml"

listener:
  enabled: true
  log_file: "mavlink_raw_log_c172p.jsonl"
  forward_to_mavsdk: true
  relay_commands_to_simulink: true
  message_types:
    - HEARTBEAT
    - SYS_STATUS
    - BATTERY_STATUS
    - ATTITUDE
    - LOCAL_POSITION_NED
    - GLOBAL_POSITION_INT
    - GPS_RAW_INT
    - VFR_HUD
    - ACTUATOR_OUTPUT_STATUS
    - SERVO_OUTPUT_RAW
    - HIL_ACTUATOR_CONTROLS
    - HIL_SENSOR
    - HIL_GPS
    - HOME_POSITION
    - ESTIMATOR_STATUS
    - COMMAND_ACK
    - MISSION_ACK
    - MISSION_CURRENT
    - MISSION_ITEM_REACHED
    - MISSION_COUNT
    - MISSION_REQUEST
    - MISSION_REQUEST_INT
    - MISSION_ITEM
    - MISSION_ITEM_INT
    - EXTENDED_SYS_STATE
    - STATUSTEXT

safety:
  require_position_ok_for_takeoff: true
  # Raised for c172p's climb-out (120 m relative_altitude_m waypoints, 25 m takeoff altitude) --
  # config.yaml's 10.0 m defaults are sized for the hexarotor mission.
  max_takeoff_altitude_m: 30.0
  max_mission_altitude_m: 150.0
  allow_real_vehicle_commands: true
  allow_pymavlink_commands: true
