mission:
  enabled: true
  name: "c172pJSBSim_fixedwing_racetrack_waypoints_rtl"

  # Cloned verbatim from mission_c172p.yaml -- same airframe/FCS limits (10044_optimAeroC172pJSBSim
  # mirrors 10043_optimAeroC172p's FW_AIRSPD_MIN/TRIM/MAX and FW_R_LIM), same shared setUpVehicle.m
  # initial conditions, so the same speed/altitude/turn-radius/waypoint math applies unchanged.
  # Re-confirm HOME_POSITION live before trusting these waypoints -- if c172pJSBSim's JSBSim reset
  # file (c172pJSBSimInit) anchors a different starting lat/lon than c172p's, this box will need
  # recomputing the same way the c172p comment describes.
  speed_m_s: 24.0
  relative_altitude_m: 120.0
  acceptance_radius_m: 80.0
  is_fly_through: true
  loiter_time_s: 0.0

  clear_existing: true
  include_takeoff_item: true
  rtl_after_mission: true
  land_after_mission: false
  takeoff_settle_s: 2.0
  # _wait_mission_complete()/_wait_landed() in controller_mavsdk.py use asyncio.wait_for, which
  # times out on REAL wall-clock seconds, not simulated seconds -- but this SIL's MATLAB Simulink
  # Accelerator-mode lockstep loop runs at roughly 9x slower than real time (confirmed live
  # 2026-07-24/25: still mid-mission, seq_current=1/6, "in failsafe: no", steadily climbing toward
  # relative_altitude_m above with commander reporting AUTO_MISSION and no failsafe, when the
  # un-scaled 300s/90s wall-clock budgets below expired and killed the harness -- PX4 itself kept
  # flying the uploaded mission autonomously afterward since it doesn't depend on this script).
  # Scaled ~10x to give a full climb + 4-waypoint racetrack + RTL + land enough real wall-clock
  # time to actually finish, not because the mission logic itself is slow.
  mission_timeout_s: 3000
  land_timeout_s: 900

  waypoints:
    - name: "wp1_climbout_north"
      latitude_deg: 17.645045
      longitude_deg: -63.198281

    - name: "wp2_crosswind_east"
      latitude_deg: 17.645045
      longitude_deg: -63.191681

    - name: "wp3_downwind_south"
      latitude_deg: 17.636960
      longitude_deg: -63.191681

    - name: "wp4_base_return"
      latitude_deg: 17.636960
      longitude_deg: -63.198281
